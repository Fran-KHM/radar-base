name: Atualizar base de radares

# Todo dia as 06:17 UTC (03:17 em Brasilia) e quando for disparado a mao na aba Actions
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Testar o calculo de sentido
        run: python3 testes/teste_sentido.py

      - name: Instalar osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      - name: Baixar o Brasil do Geofabrik e separar radares e vias de carro
        run: |
          curl -fsSL --retry 3 -o brasil.osm.pbf https://download.geofabrik.de/south-america/brazil-latest.osm.pbf
          osmium tags-filter brasil.osm.pbf n/highway=speed_camera -o radares.osm.pbf
          osmium export radares.osm.pbf -f geojson --add-unique-id=type_id -o radares.geojson
          osmium tags-filter brasil.osm.pbf w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street -o vias.osm.pbf
          rm brasil.osm.pbf
          osmium export vias.osm.pbf -f geojsonseq --geometry-types=linestring --add-unique-id=type_id -x print_record_separator=false -o vias.geojsonseq
          rm vias.osm.pbf
          curl -fsSL --retry 3 -o cet.csv https://raw.githubusercontent.com/cetsp-dados/dados-fiscalizacao-eletronica/HEAD/Base_Locais_Fiscalizados.csv

      - name: Sentido de cada radar pela pista de mao unica
        run: python3 sentido.py radares.geojson cet.csv vias.geojsonseq sentidos.json pistas.json chegadas.json

      - name: Gerar blocos (CET + OpenStreetMap)
        shell: pwsh
        run: ./gerar_base.ps1 -Saida servidor -Destino . -Area BR -OsmGeoJson radares.geojson -Sentidos sentidos.json -Pistas pistas.json -Chegadas chegadas.json

      - name: Publicar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blocos dados
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Base de radares $(date -u +%Y-%m-%d)"
            git push
          fi
