name: Atualizar base de radares

# Todo dia as 06:17 UTC (03:17 em Brasilia) e quando for disparado a mao na aba Actions
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Gerar blocos (CET + OpenStreetMap)
        shell: pwsh
        run: ./gerar_base.ps1 -Saida servidor -Destino . -Area BR

      - name: Publicar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blocos dados
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Base de radares $(date -u +%Y-%m-%d)"
            git push
          fi
