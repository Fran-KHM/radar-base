name: Atualizar base de radares

# Todo dia as 06:17 UTC (03:17 em Brasilia) e quando for disparado a mao na aba Actions
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Instalar osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      - name: Baixar o Brasil do Geofabrik e separar os radares
        run: |
          curl -fsSL --retry 3 -o brasil.osm.pbf https://download.geofabrik.de/south-america/brazil-latest.osm.pbf
          osmium tags-filter brasil.osm.pbf n/highway=speed_camera -o radares.osm.pbf
          osmium export radares.osm.pbf -f geojson --add-unique-id=type_id -o radares.geojson
          rm brasil.osm.pbf

      - name: Gerar blocos (CET + OpenStreetMap)
        shell: pwsh
        run: ./gerar_base.ps1 -Saida servidor -Destino . -Area BR -OsmGeoJson radares.geojson

      - name: Publicar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A blocos dados
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Base de radares $(date -u +%Y-%m-%d)"
            git push
          fi
